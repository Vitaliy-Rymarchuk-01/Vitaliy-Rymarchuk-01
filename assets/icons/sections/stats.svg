<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeLeft" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="264" y2="40">
      <stop offset="0%" stop-color="#C8A15A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C8A15A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeRight" gradientUnits="userSpaceOnUse" x1="636" y1="40" x2="900" y2="40">
      <stop offset="0%" stop-color="#C8A15A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8A15A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="940" height="120">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="40" x2="264" y2="40" stroke="url(#fadeLeft)" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="48"
        text-anchor="middle"
        fill="#C8A15A"
        font-family="Cinzel, Georgia, serif"
        font-size="28"
        letter-spacing="3"
        filter="url(#glow)">
    ✦ GITHUB STATS ✦
  </text>
  <line x1="636" y1="40" x2="900" y2="40" stroke="url(#fadeRight)" stroke-width="2" filter="url(#glow)"/>
</svg>
